# XenonRecomp config for Backbreaker (Xbox 360, USA/Europe)
[main]
file_path = "../game/extracted/default.xex"
out_directory_path = "../ppc"
switch_table_file_path = "backbreaker_switch_tables.toml"

# Optimizations: keep off until the recompilation runs correctly
