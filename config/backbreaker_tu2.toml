# XenonRecomp config for Backbreaker (Xbox 360, USA/Europe) with Title Update #2 applied: the disc's
# default.xex patched with the update's default.xexp (docs/title-update.md). The disc executable's
# config is backbreaker.toml; the update is a relink, so every address here differs.
[main]
file_path = "../game/extracted/default.xex"
patch_file_path = "../game/extracted/tu2/default.xexp"
patched_file_path = "../game/extracted/tu2/default.xex" # made from the two above when it is missing
out_directory_path = "../ppc-tu2"
switch_table_file_path = "backbreaker_tu2_switch_tables.toml"

# Optimizations: keep off until the recompilation runs correctly
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Register save/restore helpers (found by byte pattern, one hit each)
restgprlr_14_address = 0x828EBA10
savegprlr_14_address = 0x828EB9C0
restfpr_14_address = 0x828EC31C
savefpr_14_address = 0x828EC2D0
restvmx_14_address = 0x828ED6D8
savevmx_14_address = 0x828ED440
restvmx_64_address = 0x828ED76C
savevmx_64_address = 0x828ED4D4

# TODO: longjmp_address / setjmp_address

invalid_instructions = [
    { data = 0x00000000, size = 4 }, # Padding
]

