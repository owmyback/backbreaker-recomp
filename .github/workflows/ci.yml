name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # No game files: everything here builds from this repo, the pinned
    # XenonRecomp commit and the stub config in tests/ppc_config_stub.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build shellcheck zlib1g-dev

      - name: Lint the setup script
        # Before the slow steps: a script mistake should not cost a XenonRecomp build.
        run: shellcheck scripts/setup.sh

      - name: Build patched XenonRecomp
        run: |
          git clone --recursive https://github.com/hedge-dev/XenonRecomp.git third_party/XenonRecomp
          git -C third_party/XenonRecomp checkout ddd128b
          git -C third_party/XenonRecomp submodule update --init --recursive   # submodules as of ddd128b
          git -C third_party/XenonRecomp apply ../../patches/xenonrecomp-backbreaker-instructions.patch
          cmake -S third_party/XenonRecomp -B third_party/XenonRecomp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          ninja -C third_party/XenonRecomp/build

      - name: Build instruction tests (no game files)
        run: |
          X=third_party/XenonRecomp
          mkdir -p build
          clang++ -std=c++20 -O2 -march=x86-64-v3 \
            -I tests/ppc_config_stub -I $X/XenonUtils -I $X/thirdparty/simde \
            tests/instr_semantics.cpp -o build/instr_semantics

      - name: Run instruction tests
        run: ./build/instr_semantics

      - name: Build tiling test (header-only, two translation units)
        run: |
          mkdir -p build
          clang++ -std=c++20 -Wall -Wextra -O2 tests/tiling_test.cpp tests/tiling_test_odr.cpp -o build/tiling_test

      - name: Run tiling test
        run: ./build/tiling_test

      - name: Build mip layout test (header-only)
        run: clang++ -std=c++20 -Wall -Wextra -O2 tests/mip_layout_test.cpp -o build/mip_layout_test

      - name: Run mip layout test
        run: ./build/mip_layout_test

      - name: Build resolve clear value test (header-only)
        run: clang++ -std=c++20 -Wall -Wextra -O2 tests/clear_value_test.cpp -o build/clear_value_test

      - name: Run resolve clear value test
        run: ./build/clear_value_test

      - name: Build audio frame conversion test (header-only)
        run: clang++ -std=c++20 -Wall -Wextra -O2 tests/audio_convert_test.cpp -o build/audio_convert_test

      - name: Run audio frame conversion test
        run: ./build/audio_convert_test

      - name: Build SPA (achievement database) parser test (header-only)
        run: clang++ -std=c++20 -Wall -Wextra -O2 tests/spa_test.cpp -o build/spa_test

      - name: Run SPA parser test
        run: ./build/spa_test

      - name: Build XMA context test (header-only, synthetic packets, no decoder)
        run: clang++ -std=c++20 -Wall -Wextra -O2 tests/xma_context_test.cpp -o build/xma_context_test

      - name: Run XMA context test
        run: ./build/xma_context_test

      # PNG writer round trip: zlib inflates IDAT back, which is the only place the tests use it.
      - name: Build PNG writer test
        run: |
          mkdir -p build
          clang++ -std=c++20 -Wall -Wextra -O2 tests/png_test.cpp runtime/debug/png.cpp -lz -o build/png_test

      - name: Run PNG writer test
        run: ./build/png_test

      - name: Check tools scripts compile
        run: python3 -m py_compile tools/*.py

      - name: "Check the build identity (issue #75)"
        # The runtime itself cannot be linked here: it needs ppc/, the recompiled game code, which
        # only exists after a game checkout. What can be checked without game files is the identity
        # itself - the header the build stamps out of git, and the one translation unit that turns
        # it into the strings the log, the window title, capture summaries and --version print.
        run: |
          cmake -DGIT_EXECUTABLE=git -DSRC="$PWD" -DOUT=build/build_version.h -P cmake/git_version.cmake
          cat build/build_version.h
          grep -qE '^#define BB_GIT_REV    "[0-9a-f]{7,}"$' build/build_version.h
          grep -qE '^#define BB_GIT_BRANCH "[^"]+"$' build/build_version.h
          grep -qE '^#define BB_BUILD_DATE "[0-9]{4}-[0-9]{2}-[0-9]{2}"$' build/build_version.h
          # A CI checkout is detached, so the branch has to come from the ref Actions asked for;
          # "HEAD" or "unknown" in the log would make a CI-built binary untraceable.
          # (An "if", not "! grep": bash -e ignores a failing "!" pipeline, so that never fails.)
          if grep -qE '^#define BB_GIT_BRANCH "(HEAD|unknown)"$' build/build_version.h; then exit 1; fi
          clang++ -std=c++20 -Wall -Wextra -c runtime/build_id.cpp -I runtime -I build -o build/build_id.o
          # Not a git checkout (source tarball) must still build, and say so rather than guess.
          cmake -DGIT_EXECUTABLE=git -DSRC="$RUNNER_TEMP" -DOUT=build/build_version_nogit.h -P cmake/git_version.cmake
          grep -qE '^#define BB_GIT_REV    "unknown"$' build/build_version_nogit.h

      - name: Check the fps report tool against its log fixtures
        # No game files and no game code: the fixtures are hand-written from the status-line
        # format documented in docs/runtime.md, and every number checked here is what that
        # fixture means, so a change in the tool that shifts a count fails the step.
        run: |
          python3 tools/fps_report.py tests/data/fps_report_sample.log > fps_report.txt
          grep -qF 'seconds 12  mean 23.8  min 6  below 25 4 (33.3%)  below 20 3 (25.0%)' fps_report.txt
          grep -qF 'dips below 25: 4 of 12 seconds' fps_report.txt
          grep -qF 'compiled by shaderc 48 (1687 ms)' fps_report.txt
          grep -qF 'seconds holding a screenshot or capture: 2 (25.0 fps mean, 6 min, without them)' fps_report.txt
          # Events belong to the status line AFTER them (it closes the second they happened in).
          grep -qE '^  t=5 +6 fps .*compiled by shaderc 48 \(1687 ms\)' fps_report.txt
          grep -qE '^  t=7 +12 fps .*\[overhead\].*screenshot screenshots/2026-11-15_12-00-07.png' fps_report.txt
          # After the last status line: a second that never closed, dropped. (Not "! grep": bash -e
          # ignores a failing "!" pipeline, so it could never fail the step.)
          if grep -qF 'from the shader cache 3' fps_report.txt; then exit 1; fi
          python3 tools/fps_report.py tests/data/fps_report_sample.log --threshold 12 --from 3 --to 9 > narrow.txt
          grep -qF 'seconds 7  mean 23.1' narrow.txt
          grep -qF 'dips below 12: 1 of 7 seconds' narrow.txt
          python3 tools/fps_report.py tests/data/fps_report_sample.log --compare tests/data/fps_report_sample_b.log > compare.txt
          grep -qF 'frames total 286 vs 194: 67.8%' compare.txt
          python3 tools/fps_report.py tests/data/fps_report_sample.log --compare tests/data/fps_report_sample_b.log --from 3 --to 9 > compare_narrow.txt
          grep -qF 'frames total 162 vs 109: 67.3%' compare_narrow.txt

      # The tools' unit tests, tests/test_*.py: capture_diff.py's comparison rules against the small
      # capture pairs in tests/data (#79), and shader_effects.py against a hand-built pack (#80).
      # No game files or built runtime needed; shader_effects.py's shipped-pack checks skip here.
      - name: Test the tools scripts
        run: python3 -m unittest discover -s tests -p 'test_*.py'
