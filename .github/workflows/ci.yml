name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # No game files: everything here builds from this repo, the pinned
    # XenonRecomp commit and the stub config in tests/ppc_config_stub.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build

      - name: Build patched XenonRecomp
        run: |
          git clone --recursive https://github.com/hedge-dev/XenonRecomp.git third_party/XenonRecomp
          git -C third_party/XenonRecomp checkout ddd128b
          git -C third_party/XenonRecomp submodule update --init --recursive   # submodules as of ddd128b
          git -C third_party/XenonRecomp apply ../../patches/xenonrecomp-backbreaker-instructions.patch
          cmake -S third_party/XenonRecomp -B third_party/XenonRecomp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          ninja -C third_party/XenonRecomp/build

      - name: Build instruction tests (no game files)
        run: |
          X=third_party/XenonRecomp
          mkdir -p build
          clang++ -std=c++20 -O2 -march=x86-64-v3 \
            -I tests/ppc_config_stub -I $X/XenonUtils -I $X/thirdparty/simde \
            tests/instr_semantics.cpp -o build/instr_semantics

      - name: Run instruction tests
        run: ./build/instr_semantics

      - name: Build tiling test (header-only, two translation units)
        run: |
          mkdir -p build
          clang++ -std=c++20 -Wall -Wextra -O2 tests/tiling_test.cpp tests/tiling_test_odr.cpp -o build/tiling_test

      - name: Run tiling test
        run: ./build/tiling_test

      - name: Check tools scripts compile
        run: python3 -m py_compile tools/*.py
